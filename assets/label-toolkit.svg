<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t">
  <title id="t">Toolkit</title>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
    .h{animation:up .7s ease-out both}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.6,0,.2,1) .2s both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="120" rx="28" fill="#F4F1EA"/>
  <g class="h">
    <text x="60" y="62" class="d" fill="#14161A" font-size="32" font-weight="700" letter-spacing="-.8">Toolkit</text>
    <text x="60" y="90" class="m" fill="#5F6168" font-size="12.5" letter-spacing="1.2">WHAT THE STATIONS ARE BUILT FROM</text>
  </g>
  <rect x="260" y="56" width="880" height="9" rx="4.5" fill="#14161A" class="bar"/>
  <circle cx="1140" cy="60.5" r="11" fill="#F4F1EA" stroke="#2F55E4" stroke-width="5"/>
</svg>
