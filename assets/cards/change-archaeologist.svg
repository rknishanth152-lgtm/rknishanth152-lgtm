<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">Change Archaeologist</title>
  <desc id="d">Local-first static analysis that compares a function across two Git revisions and looks for matching changes in its tests, separating evidence from inference.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes slip{0%,8%{transform:none}14%,90%{transform:translateY(12px)}98%,100%{transform:none}}
    @keyframes was{0%,10%{opacity:1}13%,90%{opacity:0}97%,100%{opacity:1}}
    @keyframes now{0%,10%{opacity:0}13%,90%{opacity:1}97%,100%{opacity:0}}
    @keyframes bore1{0%,16%{transform:scaleY(0);opacity:1}30%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes bore2{0%,30%{transform:scaleY(0);opacity:1}44%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes bore3{0%,44%{transform:scaleY(0);opacity:1}58%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes tag1{0%,29%{opacity:0;transform:translateY(6px)}33%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes tag2{0%,43%{opacity:0;transform:translateY(6px)}47%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes tag3{0%,57%{opacity:0;transform:translateY(6px)}61%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    .slip{animation:slip 10s cubic-bezier(.6,0,.2,1) infinite}
    .was{animation:was 10s linear infinite}.now{animation:now 10s linear infinite}
    .bore{transform-box:fill-box;transform-origin:top}
    .b1{animation:bore1 10s cubic-bezier(.5,0,.3,1) infinite}.b2{animation:bore2 10s cubic-bezier(.5,0,.3,1) infinite}.b3{animation:bore3 10s cubic-bezier(.5,0,.3,1) infinite}
    .t1{animation:tag1 10s ease-out infinite}.t2{animation:tag2 10s ease-out infinite}.t3{animation:tag3 10s ease-out infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 08 · GIT HISTORY</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="28" font-weight="700" letter-spacing="-.8">Change Archaeologist</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">See how a function changed between</text><text x="40" y="174" class="d ink" font-size="16">two Git versions, and whether its</text><text x="40" y="198" class="d ink" font-size="16">tests moved with it. No AI.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">TYPESCRIPT · TS-MORPH · REACT + VITE</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">6 PATTERNS TESTED · RUNS LOCALLY</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <defs>
      <clipPath id="panel"><rect x="372" y="62" width="196" height="240" rx="14"/></clipPath>
      <clipPath id="beforeSide"><path d="M372 62 H480 L450 250 H372 Z"/></clipPath>
      <clipPath id="afterSide"><path d="M480 62 H568 V250 H450 Z"/></clipPath>
      <pattern id="undug" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#EAE5DA"/><rect width="3" height="9" fill="#CFC8B8"/></pattern>
    </defs>
    <g clip-path="url(#panel)">
      <g clip-path="url(#beforeSide)">
        <rect x="372" y="40" width="196" height="90" fill="#EAE5DA"/><rect x="372" y="130" width="196" height="50" fill="#DFD8C9"/><rect x="372" y="180" width="196" height="90" fill="#D2CBBB"/><rect x="384" y="100" width="60" height="6" rx="3" fill="#BDB5A1"/><rect x="384" y="204" width="46" height="6" rx="3" fill="#BDB5A1"/><rect x="384" y="222" width="54" height="6" rx="3" fill="#BDB5A1"/>
        <text x="384" y="160" class="m ink" font-size="11.5" font-weight="700">× 0.10</text>
      </g>
      <g clip-path="url(#afterSide)"><g class="slip">
        <rect x="372" y="40" width="196" height="90" fill="#EAE5DA"/><rect x="372" y="130" width="196" height="50" fill="#DFD8C9"/><rect x="372" y="180" width="196" height="90" fill="#D2CBBB"/><rect x="490" y="100" width="62" height="6" rx="3" fill="#BDB5A1"/><rect x="490" y="204" width="40" height="6" rx="3" fill="#BDB5A1"/><rect x="490" y="222" width="56" height="6" rx="3" fill="#BDB5A1"/>
        <text x="490" y="160" class="m ink was alt" font-size="11.5" font-weight="700">× 0.10</text>
        <text x="490" y="160" class="m ink now" font-size="11.5" font-weight="700">× 0.15</text>
      </g></g>
      <rect x="372" y="250" width="196" height="52" fill="url(#undug)"/>
    </g>
    <path d="M480 62 L450 250" fill="none" stroke="#14161A" stroke-width="3.5" stroke-linecap="round"/>
    <text x="384" y="84" class="m ink" font-size="9.5" font-weight="700" letter-spacing="1">BASE</text>
    <text x="556" y="84" text-anchor="end" class="m ink" font-size="9.5" font-weight="700" letter-spacing="1">HEAD</text>
    <g class="bore b1"><rect x="426" y="194" width="7" height="74" fill="#2F55E4"/></g>
    <g class="bore b2"><rect x="485" y="194" width="7" height="12" fill="#14161A"/><rect x="485" y="214" width="7" height="12" fill="#14161A"/><rect x="485" y="234" width="7" height="12" fill="#14161A"/><rect x="485" y="254" width="7" height="12" fill="#14161A"/></g>
    <g class="bore b3"><rect x="539" y="194" width="7" height="74" fill="#F4F1EA" stroke="#14161A" stroke-width="2"/></g>
    <g class="t1"><rect x="405" y="268" width="50" height="20" rx="10" fill="#2F55E4"/><text x="430" y="281.5" text-anchor="middle" class="m" fill="#FFFFFF" font-size="8.5" font-weight="700" letter-spacing=".4">STRONG</text></g>
    <g class="t2"><rect x="463" y="268" width="50" height="20" rx="10" fill="#F4F1EA" stroke="#14161A" stroke-width="2"/><text x="488" y="281.5" text-anchor="middle" class="m ink" font-size="8.5" font-weight="700" letter-spacing=".4">WEAK</text></g>
    <g class="t3"><rect x="517" y="268" width="48" height="20" rx="10" fill="#F4F1EA" stroke="#5F6168" stroke-width="2" stroke-dasharray="4 4"/><text x="541" y="281.5" text-anchor="middle" class="m mut" font-size="8.5" font-weight="700" letter-spacing=".4">NONE</text></g>
    <rect x="372" y="62" width="196" height="240" rx="14" fill="none" stroke="#14161A" stroke-width="3"/>
    <text x="470" y="334" text-anchor="middle" class="m mut" font-size="10.5" letter-spacing="1.2">CHANGE → TEST LINKS</text>
  </g>
</svg>
