<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Change Archaeologist</title>
  <desc id="d">Local-first static analysis that compares a function across two Git revisions and looks for matching changes in its tests, separating evidence from inference.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes slip{0%,8%{transform:none}14%,90%{transform:translateY(16px)}98%,100%{transform:none}}
    @keyframes was{0%,10%{opacity:1}13%,90%{opacity:0}97%,100%{opacity:1}}
    @keyframes now{0%,10%{opacity:0}13%,90%{opacity:1}97%,100%{opacity:0}}
    @keyframes bore1{0%,16%{transform:scaleY(0);opacity:1}30%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes bore2{0%,30%{transform:scaleY(0);opacity:1}44%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes bore3{0%,44%{transform:scaleY(0);opacity:1}58%,90%{transform:none;opacity:1}96%,100%{transform:none;opacity:0}}
    @keyframes tag1{0%,29%{opacity:0;transform:translateY(6px)}33%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes tag2{0%,43%{opacity:0;transform:translateY(6px)}47%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes tag3{0%,57%{opacity:0;transform:translateY(6px)}61%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    .slip{animation:slip 10s cubic-bezier(.6,0,.2,1) infinite}
    .was{animation:was 10s linear infinite}.now{animation:now 10s linear infinite}
    .bore{transform-box:fill-box;transform-origin:top}
    .b1{animation:bore1 10s cubic-bezier(.5,0,.3,1) infinite}.b2{animation:bore2 10s cubic-bezier(.5,0,.3,1) infinite}.b3{animation:bore3 10s cubic-bezier(.5,0,.3,1) infinite}
    .t1{animation:tag1 10s ease-out infinite}.t2{animation:tag2 10s ease-out infinite}.t3{animation:tag3 10s ease-out infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="1200" height="380" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="51" cy="49" r="10" fill="#F4F1EA" stroke="#2F55E4" stroke-width="5"/>
    <text x="72" y="53.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 08 · GIT HISTORY · TERMINUS</text>
  </g>
  <text x="40" y="118" class="d ink e e2" font-size="48" font-weight="700" letter-spacing="-1.4">Change Archaeologist</text>
  <g class="e e3"><text x="42" y="160" class="d ink" font-size="21">See how a function changed between two Git versions,</text><text x="42" y="188" class="d ink" font-size="21">and whether its tests moved with it.</text></g>
  <g class="e e4">
    <text x="42" y="220" class="d mut" font-size="15.5">Reads both versions as syntax trees, then separates what it saw from what</text><text x="42" y="242" class="d mut" font-size="15.5">that suggests and what it can't know. No AI, and it never runs your code.</text>
    <text x="42" y="270" class="m mut" font-size="12" letter-spacing=".4">TYPESCRIPT · TS-MORPH · REACT + VITE · MONACO · NODE CLI</text>
  </g>
  <g class="e e5"><text x="44" y="326" class="d ink" font-size="38" font-weight="700" letter-spacing="-1">6</text><text x="46" y="350" class="m mut" font-size="11" letter-spacing="1.2">CHANGE PATTERNS</text><text x="194" y="326" class="d ink" font-size="38" font-weight="700" letter-spacing="-1">4</text><text x="196" y="350" class="m mut" font-size="11" letter-spacing="1.2">LINK STATUSES</text><text x="344" y="326" class="d ink" font-size="38" font-weight="700" letter-spacing="-1">0</text><text x="346" y="350" class="m mut" font-size="11" letter-spacing="1.2">AI CALLS</text></g>
  <g class="e e5">
    <text x="560" y="350" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="680" y="350" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <defs>
      <clipPath id="panel"><rect x="770" y="50" width="380" height="268" rx="16"/></clipPath>
      <clipPath id="beforeSide"><path d="M770 50 H950 L905 262 H770 Z"/></clipPath>
      <clipPath id="afterSide"><path d="M950 50 H1150 V262 H905 Z"/></clipPath>
      <pattern id="undug" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#EAE5DA"/><rect width="3" height="10" fill="#CFC8B8"/></pattern>
    </defs>
    <g clip-path="url(#panel)">
      <g clip-path="url(#beforeSide)">
        <rect x="770" y="30" width="380" height="90" fill="#EAE5DA"/><rect x="770" y="120" width="380" height="70" fill="#DFD8C9"/><rect x="770" y="190" width="380" height="100" fill="#D2CBBB"/><rect x="784" y="94" width="92" height="7" rx="3.5" fill="#BDB5A1"/><rect x="784" y="212" width="72" height="7" rx="3.5" fill="#BDB5A1"/><rect x="784" y="234" width="108" height="7" rx="3.5" fill="#BDB5A1"/>
        <text x="782" y="160" class="m ink" font-size="11" font-weight="600">return price * 0.10</text>
      </g>
      <g clip-path="url(#afterSide)"><g class="slip">
        <rect x="770" y="30" width="380" height="90" fill="#EAE5DA"/><rect x="770" y="120" width="380" height="70" fill="#DFD8C9"/><rect x="770" y="190" width="380" height="100" fill="#D2CBBB"/><rect x="965" y="94" width="128" height="7" rx="3.5" fill="#BDB5A1"/><rect x="965" y="212" width="84" height="7" rx="3.5" fill="#BDB5A1"/><rect x="965" y="234" width="116" height="7" rx="3.5" fill="#BDB5A1"/>
        <text x="945" y="160" class="m ink was alt" font-size="11" font-weight="600">return price * 0.10</text>
        <text x="945" y="160" class="m ink now" font-size="11" font-weight="600">return price * 0.15</text>
      </g></g>
      <rect x="770" y="262" width="380" height="56" fill="url(#undug)"/>
    </g>
    <path d="M950 50 L905 262" fill="none" stroke="#14161A" stroke-width="4" stroke-linecap="round"/>
    <text x="784" y="76" class="m ink" font-size="10" font-weight="700" letter-spacing="1.2">BASE</text>
    <text x="1136" y="76" text-anchor="end" class="m ink" font-size="10" font-weight="700" letter-spacing="1.2">HEAD</text>
    <g class="bore b1"><rect x="956" y="190" width="8" height="88" fill="#2F55E4"/></g>
    <g class="bore b2"><rect x="1036" y="190" width="8" height="14" fill="#14161A"/><rect x="1036" y="212" width="8" height="14" fill="#14161A"/><rect x="1036" y="234" width="8" height="14" fill="#14161A"/><rect x="1036" y="256" width="8" height="14" fill="#14161A"/></g>
    <g class="bore b3"><rect x="1111" y="190" width="8" height="88" fill="#F4F1EA" stroke="#14161A" stroke-width="2"/></g>
    <rect x="784" y="278" width="116" height="22" rx="11" fill="#F4F1EA"/>
    <text x="842" y="293" text-anchor="middle" class="m mut" font-size="9.5" font-weight="700" letter-spacing=".6">UNDUG GROUND</text>
    <g class="t1"><rect x="930" y="278" width="60" height="22" rx="11" fill="#2F55E4"/><text x="960" y="293" text-anchor="middle" class="m" fill="#FFFFFF" font-size="9.5" font-weight="700" letter-spacing=".6">STRONG</text></g>
    <g class="t2"><rect x="1010" y="278" width="60" height="22" rx="11" fill="#F4F1EA" stroke="#14161A" stroke-width="2"/><text x="1040" y="293" text-anchor="middle" class="m ink" font-size="9.5" font-weight="700" letter-spacing=".6">WEAK</text></g>
    <g class="t3"><rect x="1085" y="278" width="60" height="22" rx="11" fill="#F4F1EA" stroke="#5F6168" stroke-width="2" stroke-dasharray="4 4"/><text x="1115" y="293" text-anchor="middle" class="m mut" font-size="9.5" font-weight="700" letter-spacing=".6">NONE</text></g>
    <rect x="770" y="50" width="380" height="268" rx="16" fill="none" stroke="#14161A" stroke-width="3"/>
    <text x="960" y="346" text-anchor="middle" class="m mut" font-size="10.5" letter-spacing="1.2">FAULT = CHANGE · SHAFT = POSSIBLE TEST LINK</text>
  </g>
</svg>
