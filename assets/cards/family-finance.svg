    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 07 · HOME</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">Family Finance</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">Two phones, one shared set of books,</text><text x="40" y="174" class="d ink" font-size="16">kept to the paisa. Offline-first,</text><text x="40" y="198" class="d ink" font-size="16">in Tamil and English.</text></g>
