<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">PaperPilot</title>
  <desc id="d">Question answering over research papers in which every answer sentence cites a quoted source passage, verified in code. FastAPI, React, PostgreSQL with pgvector and GROBID.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes s1{0%,2%{opacity:0;transform:translateX(-8px)}8%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes s2{0%,14%{opacity:0;transform:translateX(-8px)}20%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes s3{0%,26%{opacity:0;transform:translateX(-8px)}32%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes pick{0%,38%{opacity:0;transform:scale(.6)}43%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes link{0%,42%{stroke-dashoffset:44}52%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes mark{0%,50%{transform:scaleX(0);opacity:1}62%,92%{transform:none;opacity:1}98%,100%{transform:none;opacity:0}}
    .s1{animation:s1 9s ease-out infinite}.s2{animation:s2 9s ease-out infinite}.s3{animation:s3 9s ease-out infinite}
    .pick{transform-box:fill-box;transform-origin:center;animation:pick 9s cubic-bezier(.3,1.6,.5,1) infinite}
    .link{stroke-dasharray:44;animation:link 9s ease-in-out infinite}
    .mark{transform-box:fill-box;transform-origin:left;animation:mark 9s cubic-bezier(.6,0,.2,1) infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 09 · LIBRARY</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">PaperPilot</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">Ask a research paper a question.</text><text x="40" y="174" class="d ink" font-size="16">Every sentence of the answer links</text><text x="40" y="198" class="d ink" font-size="16">to the exact passage it quotes.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">FASTAPI · REACT · POSTGRES + PGVECTOR</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">GROBID · 1,191 BACKEND TESTS</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <rect x="372" y="84" width="96" height="176" rx="12" fill="#EAE5DA"/>
    <g class="s1"><rect x="382" y="104" width="70" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="382" y="117" width="34" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="420" y="112" width="18" height="15" rx="4" fill="#F4F1EA" stroke="#14161A" stroke-width="1.5"/><text x="429" y="123" text-anchor="middle" class="m ink" font-size="8.5" font-weight="700">1</text></g>
    <g class="s2"><rect x="382" y="156" width="64" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="382" y="169" width="42" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="428" y="164" width="18" height="15" rx="4" fill="#F4F1EA" stroke="#14161A" stroke-width="1.5"/><text x="437" y="175" text-anchor="middle" class="m ink" font-size="8.5" font-weight="700">2</text></g>
    <g class="s3"><rect x="382" y="208" width="72" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="382" y="221" width="28" height="6" rx="3" fill="#14161A" opacity=".75"/><rect x="414" y="216" width="18" height="15" rx="4" fill="#F4F1EA" stroke="#14161A" stroke-width="1.5"/><text x="423" y="227" text-anchor="middle" class="m ink" font-size="8.5" font-weight="700">3</text></g>
    <rect x="476" y="66" width="92" height="214" rx="6" fill="#FFFFFF" stroke="#14161A" stroke-width="3"/>
    <rect x="488" y="84" width="52" height="7" rx="3.5" fill="#14161A"/>
    <rect x="488" y="108" width="64" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="120" width="58" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="132" width="66" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="144" width="44" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="206" width="62" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="218" width="66" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="230" width="50" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="242" width="60" height="5" rx="2.5" fill="#CFC8B8"/><rect x="488" y="254" width="40" height="5" rx="2.5" fill="#CFC8B8"/>
    <rect x="484" y="160" width="76" height="34" rx="4" fill="#2F55E4" fill-opacity=".16" class="mark"/>
    <rect x="488" y="168" width="66" height="5" rx="2.5" fill="#14161A"/>
    <rect x="488" y="180" width="48" height="5" rx="2.5" fill="#14161A"/>
    <g class="pick"><rect x="428" y="164" width="18" height="15" rx="4" fill="#2F55E4"/><text x="437" y="175" text-anchor="middle" class="m" fill="#FFFFFF" font-size="8.5" font-weight="700">2</text></g>
    <path d="M446 171.5 C462 171.5 466 177 484 177" fill="none" stroke="#2F55E4" stroke-width="2.5" stroke-linecap="round" class="link"/>
    <text x="470" y="334" text-anchor="middle" class="m mut" font-size="10.5" letter-spacing="1.2">EVERY SENTENCE → ITS SOURCE</text>
  </g>
</svg>
