<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">PhishSentinel</title>
  <desc id="d">Phishing URL detection: an 18-feature XGBoost model behind FastAPI, a security rule layer, and a Chrome extension.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes half{0%,49.9%{opacity:1}50%,100%{opacity:0}}
    @keyframes badge{0%,21%{opacity:0;transform:translateY(6px)}25%,46%{opacity:1;transform:none}50%,100%{opacity:0}}
    @keyframes sweep{0%{transform:translateY(140px);opacity:1}20%{transform:translateY(288px);opacity:1}21%,100%{transform:translateY(288px);opacity:0}}
    .ua{animation:half 10s linear infinite}.ub{animation-delay:-5s}
    .ba{animation:badge 10s ease-out infinite}.bb{animation-delay:-5s}
    .sw{animation:sweep 5s cubic-bezier(.5,0,.5,1) infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 05 · BROWSER</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">PhishSentinel</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">A Chrome extension that checks every</text><text x="40" y="174" class="d ink" font-size="16">page you open against an XGBoost URL</text><text x="40" y="198" class="d ink" font-size="16">model and brand-protection rules.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">XGBOOST · FASTAPI</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">CHROME MV3 · REACT + VITE</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <defs><clipPath id="page"><rect x="380" y="138" width="180" height="150"/></clipPath></defs>
    <rect x="378" y="76" width="184" height="214" rx="14" fill="#FFFFFF" stroke="#14161A" stroke-width="3"/>
    <circle cx="396" cy="94" r="3.5" fill="#CFC8B8"/><circle cx="408" cy="94" r="3.5" fill="#CFC8B8"/><circle cx="420" cy="94" r="3.5" fill="#CFC8B8"/>
    <rect x="390" y="106" width="160" height="22" rx="11" fill="#EAE5DA"/>
    <text x="402" y="121" class="m ink ua" font-size="9.5">paypa1-verify.xyz/login</text>
    <text x="402" y="121" class="m ink ua ub alt" font-size="9.5">github.com/login</text>
    <rect x="396" y="150" width="118" height="8" rx="4" fill="#EAE5DA"/>
    <rect x="396" y="166" width="146" height="8" rx="4" fill="#EAE5DA"/>
    <rect x="396" y="182" width="92" height="8" rx="4" fill="#EAE5DA"/>
    <rect x="396" y="202" width="62" height="18" rx="9" fill="#EAE5DA"/>
    <g clip-path="url(#page)"><g class="sw"><rect x="380" y="-18" width="180" height="18" fill="#2F55E4" opacity=".14"/><rect x="380" y="-2" width="180" height="3" fill="#2F55E4"/></g></g>
    <g class="ba"><rect x="398" y="234" width="144" height="36" rx="10" fill="#14161A"/><text x="470" y="256" text-anchor="middle" class="m" fill="#F4F1EA" font-size="10.5" font-weight="700" letter-spacing=".8">BLOCKED · PHISHING</text></g>
    <g class="ba bb alt"><rect x="398" y="234" width="144" height="36" rx="10" fill="none" stroke="#14161A" stroke-width="2.5"/><text x="470" y="256" text-anchor="middle" class="m ink" font-size="10.5" font-weight="700" letter-spacing=".8">TRUSTED DOMAIN</text></g>
    <text x="470" y="334" text-anchor="middle" class="m mut" font-size="10.5" letter-spacing="1.2">18 URL FEATURES → XGBOOST</text>
  </g>
</svg>
