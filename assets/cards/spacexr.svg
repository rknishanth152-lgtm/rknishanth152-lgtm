<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">SpaceXR</title>
  <desc id="d">Browser-based interactive Solar System with planet info panels, a quiz and a WebXR VR entry point.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes spin{to{transform:rotate(360deg)}}
    .o{transform-origin:470px 186px;animation:spin linear infinite}
    .o1{animation-duration:7s}.o2{animation-duration:13s;animation-delay:-5s}.o3{animation-duration:24s;animation-delay:-15s}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 02 · CLASSROOM</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">SpaceXR</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">The Solar System in a browser tab.</text><text x="40" y="174" class="d ink" font-size="16">Click a planet, read its story, take</text><text x="40" y="198" class="d ink" font-size="16">the quiz, step into VR where it works.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">A-FRAME · WEBXR · VANILLA JS</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">NO BUILD STEP · NO BACKEND</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <g fill="none" stroke="#CFC8B8" stroke-width="1.6" stroke-dasharray="3 6">
      <circle cx="470" cy="186" r="48"/><circle cx="470" cy="186" r="80"/><circle cx="470" cy="186" r="112"/>
    </g>
    <circle cx="470" cy="186" r="20" fill="#14161A"/>
    <g class="o o1"><circle cx="518" cy="186" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3"/></g>
    <g class="o o2"><circle cx="550" cy="186" r="10" fill="#2F55E4"/><circle cx="566" cy="186" r="3" fill="#14161A"/></g>
    <g class="o o3"><circle cx="582" cy="186" r="8" fill="#F4F1EA" stroke="#14161A" stroke-width="3"/><ellipse cx="582" cy="186" rx="15" ry="4.5" fill="none" stroke="#14161A" stroke-width="2.4"/></g>
    <rect x="420" y="308" width="100" height="24" rx="12" fill="#14161A"/>
    <text x="470" y="324" text-anchor="middle" class="m" fill="#F4F1EA" font-size="10.5" font-weight="700" letter-spacing="1.2">ENTER VR</text>
  </g>
</svg>
