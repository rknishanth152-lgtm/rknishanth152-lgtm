<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">WeatherGuard AI</title>
  <desc id="d">Weather risk prediction: live OpenWeatherMap data, a Random Forest RainTomorrow model and a four-tier advisory.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(54px);opacity:0}}
    @keyframes tier{0%,21%{transform:none}25%,46%{transform:translateX(48px)}50%,71%{transform:translateX(96px)}75%,96%{transform:translateX(144px)}100%{transform:none}}
    .r{animation:drop 1.1s linear infinite}
    .tier{animation:tier 8s cubic-bezier(.6,0,.2,1) infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 04 · SKY</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">WeatherGuard AI</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">Live weather in, tomorrow's rain</text><text x="40" y="174" class="d ink" font-size="16">probability out, then a plain advisory</text><text x="40" y="198" class="d ink" font-size="16">from LOW to SEVERE.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">PYTHON · FLASK · SCIKIT-LEARN</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">RANDOM FOREST · OPENWEATHERMAP</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <path d="M414 166 H526 C548 166 556 136 536 124 C536 96 504 84 486 98 C474 72 430 76 428 108 C404 110 394 166 414 166 Z" fill="#FFFFFF" stroke="#14161A" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#2F55E4" stroke-width="3" stroke-linecap="round"><path d="M430 180 v14" class="r" style="animation-delay:-0.1s"/><path d="M451 180 v14" class="r" style="animation-delay:-0.62s"/><path d="M472 180 v14" class="r" style="animation-delay:-0.33s"/><path d="M493 180 v14" class="r" style="animation-delay:-0.85s"/><path d="M514 180 v14" class="r" style="animation-delay:-0.5s"/></g>
    <text x="382" y="252" class="m mut" font-size="10" letter-spacing="1.1">TOMORROW · RISK</text>
    <rect x="382" y="262" width="44" height="14" rx="3" fill="#14161A" opacity="0.14"/><text x="404" y="296" text-anchor="middle" class="m mut" font-size="9.5" letter-spacing=".6">LOW</text><rect x="430" y="262" width="44" height="14" rx="3" fill="#14161A" opacity="0.32"/><text x="452" y="296" text-anchor="middle" class="m mut" font-size="9.5" letter-spacing=".6">MOD</text><rect x="478" y="262" width="44" height="14" rx="3" fill="#14161A" opacity="0.58"/><text x="500" y="296" text-anchor="middle" class="m mut" font-size="9.5" letter-spacing=".6">HIGH</text><rect x="526" y="262" width="44" height="14" rx="3" fill="#14161A" opacity="0.9"/><text x="548" y="296" text-anchor="middle" class="m mut" font-size="9.5" letter-spacing=".6">SEVERE</text>
    <rect x="378" y="258" width="52" height="22" rx="6" fill="none" stroke="#2F55E4" stroke-width="3" class="tier"/>
    <text x="470" y="334" text-anchor="middle" class="m mut" font-size="10.5" letter-spacing="1.2">PREDICT_PROBA → ADVISORY</text>
  </g>
</svg>
