<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">Smart Billing</title>
  <desc id="d">Java Swing billing and inventory system for Shree Annapurna Edible Oil Company, with atomic invoices and stock deduction.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes print{0%{transform:translateY(-236px);opacity:1}40%,86%{transform:none;opacity:1}100%{transform:none;opacity:0}}
    @keyframes third{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
    .rc{animation:print 6s cubic-bezier(.45,0,.2,1) infinite}
    .n{animation:third 18s linear infinite}.n2{animation-delay:-12s}.n3{animation-delay:-6s}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 01 · SHOP COUNTER</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">Smart Billing</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">Billing and inventory for Shree</text><text x="40" y="174" class="d ink" font-size="16">Annapurna Edible Oil Company. Each</text><text x="40" y="198" class="d ink" font-size="16">sale and its stock change commit together.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">JAVA 17 · SWING + FLATLAF</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">MYSQL · MAVEN</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <defs><clipPath id="slot"><rect x="380" y="84" width="180" height="250"/></clipPath></defs>
    <rect x="384" y="68" width="172" height="20" rx="10" fill="#14161A"/>
    <g clip-path="url(#slot)"><g class="rc">
      <path d="M404 78 H536 V300 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 Z" fill="#FFFFFF"/>
      <text x="418" y="108" class="m ink n" font-size="11" font-weight="700">BILL-000001</text>
      <text x="418" y="108" class="m ink n n2 alt" font-size="11" font-weight="700">BILL-000002</text>
      <text x="418" y="108" class="m ink n n3 alt" font-size="11" font-weight="700">BILL-000003</text>
      <text x="418" y="124" class="m mut" font-size="8.5" letter-spacing=".6">SHREE ANNAPURNA</text>
      <rect x="418" y="144" width="62" height="6" rx="3" fill="#CFC8B8"/><rect x="498" y="144" width="24" height="6" rx="3" fill="#CFC8B8"/>
      <rect x="418" y="164" width="76" height="6" rx="3" fill="#CFC8B8"/><rect x="498" y="164" width="24" height="6" rx="3" fill="#CFC8B8"/>
      <rect x="418" y="184" width="50" height="6" rx="3" fill="#CFC8B8"/><rect x="498" y="184" width="24" height="6" rx="3" fill="#CFC8B8"/>
      <text x="418" y="222" class="m ink" font-size="10" font-weight="700">TOTAL</text>
      <rect x="488" y="214" width="34" height="9" rx="3" fill="#2F55E4"/>
      <text x="418" y="248" class="m ink n" font-size="10">PAID · CASH</text>
      <text x="418" y="248" class="m ink n n2 alt" font-size="10">PAID · UPI</text>
      <text x="418" y="248" class="m ink n n3 alt" font-size="10">PAID · CARD</text>
      <rect x="418" y="266" width="2" height="18" fill="#14161A"/><rect x="422.4" y="266" width="1" height="18" fill="#14161A"/><rect x="425.79999999999995" y="266" width="3" height="18" fill="#14161A"/><rect x="431.19999999999993" y="266" width="1" height="18" fill="#14161A"/><rect x="434.5999999999999" y="266" width="2" height="18" fill="#14161A"/><rect x="438.9999999999999" y="266" width="1" height="18" fill="#14161A"/><rect x="442.39999999999986" y="266" width="1" height="18" fill="#14161A"/><rect x="445.79999999999984" y="266" width="3" height="18" fill="#14161A"/><rect x="451.1999999999998" y="266" width="2" height="18" fill="#14161A"/><rect x="455.5999999999998" y="266" width="1" height="18" fill="#14161A"/><rect x="458.9999999999998" y="266" width="2" height="18" fill="#14161A"/><rect x="463.39999999999975" y="266" width="3" height="18" fill="#14161A"/><rect x="468.7999999999997" y="266" width="1" height="18" fill="#14161A"/><rect x="472.1999999999997" y="266" width="2" height="18" fill="#14161A"/><rect x="476.5999999999997" y="266" width="1" height="18" fill="#14161A"/><rect x="479.99999999999966" y="266" width="3" height="18" fill="#14161A"/><rect x="485.39999999999964" y="266" width="1" height="18" fill="#14161A"/><rect x="488.7999999999996" y="266" width="2" height="18" fill="#14161A"/><rect x="493.1999999999996" y="266" width="2" height="18" fill="#14161A"/><rect x="497.59999999999957" y="266" width="1" height="18" fill="#14161A"/><rect x="500.99999999999955" y="266" width="3" height="18" fill="#14161A"/><rect x="506.3999999999995" y="266" width="1" height="18" fill="#14161A"/><rect x="509.7999999999995" y="266" width="2" height="18" fill="#14161A"/>
    </g></g>
  </g>
</svg>
