<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
  <title id="t">JanKavach</title>
  <desc id="d">Telegram bot and dashboard that analyses suspicious texts and voice notes for fraud and routes victims to the 1930 helpline.</desc>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ta{font-family:'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil',Latha,sans-serif}
    .ink{fill:#14161A}.mut{fill:#5F6168}.acc{fill:#2F55E4}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
    .e{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .e1{animation-delay:.05s}.e2{animation-delay:.13s}.e3{animation-delay:.21s}.e4{animation-delay:.29s}.e5{animation-delay:.37s}
    .v{animation:fade .8s ease-out .3s both}
    .arrow{animation:nudge 1.8s ease-in-out infinite}

    @keyframes b1{0%,3%{opacity:0;transform:translateY(10px)}8%,88%{opacity:1;transform:none}95%,100%{opacity:0}}
    @keyframes b2{0%,20%{opacity:0;transform:translateY(10px)}25%,88%{opacity:1;transform:none}95%,100%{opacity:0}}
    @keyframes b3{0%,37%{opacity:0;transform:translateY(10px)}42%,88%{opacity:1;transform:none}95%,100%{opacity:0}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .b1{animation:b1 9s ease-out infinite}.b2{animation:b2 9s ease-out infinite}.b3{animation:b3 9s ease-out infinite}
    .live{animation:blink 1.6s ease-in-out infinite}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}.alt{opacity:0}}
  </style>
  <rect width="600" height="360" rx="24" fill="#F4F1EA"/>
  <g class="e e1">
    <circle cx="47" cy="47" r="7" fill="#F4F1EA" stroke="#14161A" stroke-width="3.5"/>
    <text x="64" y="51.5" class="m mut" font-size="12" letter-spacing="1.3">STATION 06 · PHONE</text>
  </g>
  <text x="38" y="106" class="d ink e e2" font-size="34" font-weight="700" letter-spacing="-.8">JanKavach</text>
  <g class="e e3"><text x="40" y="150" class="d ink" font-size="16">Forward a suspicious text or voice</text><text x="40" y="174" class="d ink" font-size="16">note to a Telegram bot. Get a verdict,</text><text x="40" y="198" class="d ink" font-size="16">and the 1930 helpline if money is gone.</text></g>
  <g class="e e4"><text x="40" y="244" class="m mut" font-size="12" letter-spacing=".4">PYTHON · GEMINI · TELEGRAM BOT API</text><text x="40" y="264" class="m mut" font-size="12" letter-spacing=".4">STREAMLIT · SQLITE</text></g>
  <g class="e e5">
    <text x="40" y="320" class="d ink" font-size="15" font-weight="600">View repository</text>
    <g class="arrow"><text x="160" y="320" class="d acc" font-size="16" font-weight="700">→</text></g>
  </g>
  <g class="v">
    <rect x="396" y="54" width="148" height="276" rx="26" fill="#FFFFFF" stroke="#14161A" stroke-width="3"/>
    <rect x="446" y="64" width="48" height="6" rx="3" fill="#14161A"/>
    <circle cx="416" cy="92" r="4" class="acc live"/>
    <text x="426" y="96" class="d ink" font-size="11.5" font-weight="700">JanKavach</text>
    <g class="b1"><rect x="410" y="110" width="112" height="44" rx="12" fill="#EAE5DA"/>
      <text x="420" y="128" class="d ink" font-size="10.5">Your KYC expires</text><text x="420" y="143" class="d ink" font-size="10.5">today. Send OTP.</text></g>
    <g class="b2"><rect x="418" y="166" width="112" height="44" rx="12" fill="#14161A"/>
      <text x="428" y="184" class="d" fill="#F4F1EA" font-size="10.5" font-weight="600">Likely a scam.</text><text x="428" y="199" class="d" fill="#F4F1EA" font-size="10.5">Never share OTPs.</text></g>
    <g class="b3"><rect x="418" y="222" width="112" height="44" rx="12" fill="#2F55E4"/>
      <text x="428" y="240" class="d" fill="#FFFFFF" font-size="10.5" font-weight="600">Lost money?</text><text x="428" y="255" class="d" fill="#FFFFFF" font-size="10.5">Call 1930 now.</text></g>
    <rect x="410" y="292" width="120" height="22" rx="11" fill="#EAE5DA"/>
  </g>
</svg>
