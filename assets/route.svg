<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">The line so far</title>
  <desc id="d">Seven projects drawn as stations on one line: Smart Billing at the shop counter, SpaceXR in the classroom, FarmSense AI in the field, WeatherGuard AI in the sky, PhishSentinel in the browser, JanKavach on the phone, and Family Finance at home.</desc>
  <defs>
    <path id="line" d="M60 214 H330 L390 274 H760 L820 214 H1140"/>
  </defs>
  <style>
    .d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
    .ink{fill:#14161A}.mut{fill:#5F6168}
    @keyframes draw{from{stroke-dashoffset:1140}to{stroke-dashoffset:0}}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
    @keyframes pass{0%{opacity:.9;transform:scale(1)}9%{opacity:0;transform:scale(2.6)}100%{opacity:0;transform:scale(2.6)}}
    .route{stroke-dasharray:1140;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .2s both}
    .h{animation:up .7s ease-out both}
    .st{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
    .lb{animation:up .6s ease-out both}
    .ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:pass 12s ease-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.ping{opacity:0}}
  </style>

  <rect width="1200" height="380" rx="28" fill="#F4F1EA"/>

  <g class="h">
    <text x="60" y="72" class="d ink" font-size="32" font-weight="700" letter-spacing="-.8">The line so far</text>
    <text x="60" y="102" class="m mut" font-size="12.5" letter-spacing="1.2">SEVEN PROJECTS · SEVEN PLACES THEY RUN</text>
  </g>
  <text x="1140" y="72" text-anchor="end" class="m mut h" font-size="12.5" letter-spacing="1.2" style="animation-delay:.15s">SHOP → CLASSROOM → FIELD → SKY → BROWSER → PHONE → HOME</text>

  <use xlink:href="#line" class="route" fill="none" stroke="#14161A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pings fire as the train passes (delay = 1.9s start + distance/length × 11.28s of travel) -->
  <g fill="none" stroke="#2F55E4" stroke-width="3">
    <circle cx="120" cy="214" r="11" class="ping" style="animation-delay:2.5s"/>
    <circle cx="260" cy="214" r="11" class="ping" style="animation-delay:3.9s"/>
    <circle cx="440" cy="274" r="11" class="ping" style="animation-delay:5.94s"/>
    <circle cx="590" cy="274" r="11" class="ping" style="animation-delay:7.44s"/>
    <circle cx="735" cy="274" r="11" class="ping" style="animation-delay:8.89s"/>
    <circle cx="900" cy="214" r="11" class="ping" style="animation-delay:10.78s"/>
    <circle cx="1080" cy="214" r="14" class="ping" style="animation-delay:12.58s"/>
  </g>

  <g fill="#F4F1EA" stroke="#14161A" stroke-width="4.5">
    <circle cx="120" cy="214" r="11" class="st" style="animation-delay:.3s"/>
    <circle cx="260" cy="214" r="11" class="st" style="animation-delay:.45s"/>
    <circle cx="440" cy="274" r="11" class="st" style="animation-delay:.75s"/>
    <circle cx="590" cy="274" r="11" class="st" style="animation-delay:.9s"/>
    <circle cx="735" cy="274" r="11" class="st" style="animation-delay:1.05s"/>
    <circle cx="900" cy="214" r="11" class="st" style="animation-delay:1.35s"/>
    <circle cx="1080" cy="214" r="15" stroke="#2F55E4" stroke-width="6" class="st" style="animation-delay:1.55s"/>
  </g>

  <!-- labels: above the upper track, below the lower track -->
  <g text-anchor="middle">
    <g class="lb" style="animation-delay:.5s"><text x="120" y="156" class="m mut" font-size="11.5" letter-spacing="1.2">01 · SHOP</text><text x="120" y="182" class="d ink" font-size="17" font-weight="600">Smart Billing</text></g>
    <g class="lb" style="animation-delay:.65s"><text x="260" y="156" class="m mut" font-size="11.5" letter-spacing="1.2">02 · CLASSROOM</text><text x="260" y="182" class="d ink" font-size="17" font-weight="600">SpaceXR</text></g>
    <g class="lb" style="animation-delay:.95s"><text x="440" y="320" class="d ink" font-size="17" font-weight="600">FarmSense AI</text><text x="440" y="344" class="m mut" font-size="11.5" letter-spacing="1.2">03 · FIELD</text></g>
    <g class="lb" style="animation-delay:1.1s"><text x="590" y="320" class="d ink" font-size="17" font-weight="600">WeatherGuard AI</text><text x="590" y="344" class="m mut" font-size="11.5" letter-spacing="1.2">04 · SKY</text></g>
    <g class="lb" style="animation-delay:1.25s"><text x="735" y="320" class="d ink" font-size="17" font-weight="600">PhishSentinel</text><text x="735" y="344" class="m mut" font-size="11.5" letter-spacing="1.2">05 · BROWSER</text></g>
    <g class="lb" style="animation-delay:1.5s"><text x="900" y="156" class="m mut" font-size="11.5" letter-spacing="1.2">06 · PHONE</text><text x="900" y="182" class="d ink" font-size="17" font-weight="600">JanKavach</text></g>
    <g class="lb" style="animation-delay:1.7s"><text x="1080" y="156" class="m mut" font-size="11.5" letter-spacing="1.2">07 · HOME</text><text x="1080" y="182" class="d ink" font-size="17" font-weight="700">Family Finance</text></g>
  </g>

  <!-- the train -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>
    <rect x="-20" y="-8" width="40" height="16" rx="8" fill="#2F55E4"/>
    <rect x="6" y="-3.5" width="8" height="7" rx="2" fill="#F4F1EA"/>
    <animateMotion dur="12s" begin="1.9s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.94;1" calcMode="linear">
      <mpath xlink:href="#line"/>
    </animateMotion>
  </g>
</svg>
